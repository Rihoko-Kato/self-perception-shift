<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <!-- スマホでのピンチ拡大・ダブルタップ拡大を止め、画面いっぱいに表示する -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0e0f14">
    <title>Self Perception Shift</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0f14;
        color: #ebebf2;
        font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
        /* スクロール・引っ張って更新・長押しメニューを止める */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #0e0f14;
        outline: none;
      }
      /* 文章入力欄（WebTextInput.jslib が作る）は選択・入力できるようにする */
      #sps-text-input {
        -webkit-user-select: text;
        user-select: text;
        touch-action: auto;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2em;
        background: #0e0f14;
        text-align: center;
        line-height: 1.8;
        z-index: 20;
      }
      #loading .bar {
        width: min(240px, 50vw);
        height: 2px;
        background: rgba(235, 235, 242, 0.15);
        overflow: hidden;
      }
      #loading .fill {
        width: 0%;
        height: 100%;
        background: rgba(235, 235, 242, 0.8);
        transition: width 0.2s;
      }
      #loading .label {
        font-size: 14px;
        letter-spacing: 0.1em;
        opacity: 0.6;
      }
      /* 縦向きのスマホ・タブレットでは「横画面で遊んでください」を出す */
      #rotate {
        display: none;
        font-size: 16px;
        z-index: 30;
      }
      #rotate .icon {
        width: 44px;
        height: 72px;
        border: 2px solid rgba(235, 235, 242, 0.8);
        border-radius: 8px;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%, 20% { transform: rotate(0deg); }
        50%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loading" class="overlay">
      <div class="label">よみこみ中</div>
      <div class="bar"><div class="fill" id="loading-fill"></div></div>
    </div>

    <div id="rotate" class="overlay">
      <div class="icon"></div>
      <div>横画面で遊んでください</div>
    </div>

    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector('#unity-canvas');
      var fill = document.querySelector('#loading-fill');

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Self Perception Shift",
        productVersion: "0.1.0",
        // 高精細なスマホで重くなりすぎないよう、描画の細かさを最大 2 倍までにする
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + '%';
      }).then(function () {
        document.querySelector('#loading').style.display = 'none';
        canvas.focus();
      }).catch(function (message) {
        document.querySelector('#loading .label').textContent = '読み込みに失敗しました：' + message;
      });
    </script>
  </body>
</html>
